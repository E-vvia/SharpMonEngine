name: .NET Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - name: List project files
        run: find . -name "*.csproj"
        
      - name: Restore dependencies
        run: dotnet restore ./SharpMonEngine.Battle.Test/SharpMonEngine.Battle.Test.csproj

      - name: Build
        run: dotnet build ./SharpMonEngine.Battle.Test/SharpMonEngine.Battle.Test.csproj --no-restore

      - name: Run tests
        run: dotnet test ./SharpMonEngine.Battle.Test/SharpMonEngine.Battle.Test.csproj --no-build --verbosity normal
